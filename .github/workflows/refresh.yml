name: Rafraîchir les créneaux

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Demandé toutes les 15 min de 7 h à 23 h (heure de Paris, 6 h à 22 h l'été).
    # En pratique GitHub espace les lancements planifiés : compter environ une fois par heure.
    - cron: "4,19,34,49 5-21 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests du parseur
        run: python -m unittest discover tests

      # Si la collecte échoue, on ne republie pas : la page garde les dernières
      # données et affiche « Données anciennes » au bout de 2 h.
      - name: Collecte tennispadel.paris.fr
        id: scrape
        continue-on-error: true
        run: python scraper/scrape.py --out site/data.json

      - uses: actions/configure-pages@v5
        if: steps.scrape.outcome == 'success'

      - uses: actions/upload-pages-artifact@v3
        if: steps.scrape.outcome == 'success'
        with:
          path: site

      - id: deploy
        if: steps.scrape.outcome == 'success'
        uses: actions/deploy-pages@v4

      # Lancement en rouge dans l'onglet Actions (et e-mail de GitHub) si la collecte a échoué.
      - name: Signaler un échec de collecte
        if: steps.scrape.outcome != 'success'
        run: |
          echo "::error::Collecte en échec : la page garde les données précédentes. Voir l'étape « Collecte » ci-dessus."
          exit 1
