name: Diagnostic

on:
  push:
    branches: [diag]

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scraper/diag.py
      - name: Enregistrer les captures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f diag
          git commit -m "diag: captures $(date -u +%FT%H%M)"
          git push origin HEAD:diag
